##
# sciectl 카탈로그 인덱스 정의 파일 (catalogs.ini)
#
# [섹션명]      : 카탈로그 고유 식별자 (CATALOG_ID)
# title        : 카탈로그 대표 이름
# description  : 카탈로그에 포함된 패키지, 도구 등을 설명하는 내용
# catalog_file : env/catalogs/ 하위 매니페스트 파일명
##
[default-server]
title=기본 서버 환경 설치
description=기본 서버 운영 환경 및 유틸리티를 제공합니다. (temurin-25-jdk, htop 포함)
catalog_file=default-server.catalog

[default-devops]
title=기본 개발 환경 (빌드/배포/운영)
description=git, temurin-25-jdk, maven-3.9.15 및 Git/Maven/Docker 배포 유틸리티를 제공합니다.
catalog_file=default-devops.catalog

[network]
title=네트워크 관련 도구 설치
description=firewall-cmd 지원 유틸, VLAN 라우팅 경로, netstat 모니터링 및 방화벽 우선순위 설정을 제공합니다.
catalog_file=network.catalog

[docker]
title=Docker 관련 도구 설치
description=Docker CE 엔진 설치 및 컨테이너/네트워크/Compose 관리 유틸리티를 제공합니다.
catalog_file=docker.catalog

[install-lets-encrypt-certificate]
title=Let's Encrypt 인증서 설치 지원
description=Let's Encrypt SSL/TLS 인증서 자동 배포용 SSH RSA 공개키를 등록합니다.
catalog_file=install-lets-encrypt-certificate.catalog

[gitlab]
title=GitLab Group/Project Clone 설치 지원
description=GitLab 그룹 및 하위 프로젝트 일괄 Clone 스크립트(gitlab-clone, clone-gitlab-projects)를 설치합니다.
catalog_file=gitlab.catalog

[ai-agent]
title=AI Agent 사용자 정의 Skill & Rule 생성 지원
description=AI Agent Skill & Rule 파일 생성 및 관리 도구(acs-cli)와 기본 패키지 환경을 제공합니다.
catalog_file=ai-agent.catalog
